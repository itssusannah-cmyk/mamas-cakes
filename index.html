<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baker Shop</title>
<style>
  body{font-family:Arial;margin:0;background:#FFF8F0}
  header{background:#0B1D3A;color:white;padding:20px;text-align:center;position:relative}
  header h1{margin:0}
  .lang-btn{position:absolute;top:15px;right:15px;background:#FF7A00;color:white;border:none;padding:8px 12px;border-radius:20px;cursor:pointer}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
  .card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  .card img{width:100%;height:160px;object-fit:cover}
  .card div{padding:10px}
  .price{color:#FF7A00;font-weight:bold}
  .orderBtn{display:block;background:#25D366;color:white;text-align:center;padding:12px;text-decoration:none;border-radius:10px;margin-top:8px;font-weight:bold}
  #adminPanel{display:none;background:white;margin:12px;padding:15px;border-radius:15px;border:2px dashed #FF7A00}
  input{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
  .adminBtn{background:#0B1D3A;color:white;border:none;padding:12px;border-radius:10px;width:100%;margin-top:6px;cursor:pointer}
</style>
</head>
<body>
<header>
  <button class="lang-btn" onclick="switchLang()">EN | SW</button>
  <h1 id="shopName">Mama's Cakes</h1>
  <p data-t="tagline">Fresh, Sweet, Homemade</p>
</header>
<div class="grid" id="menuGrid"><p style="padding:20px">Loading cakes...</p></div>
<div id="adminPanel">
  <h3>Admin Panel 🔒</h3>
  <label>Shop Name</label>
  <input id="inShopName" placeholder="Mama's Cakes">
  <label>WhatsApp Number (e.g 255...)</label>
  <input id="inWhatsapp" placeholder="255712345678">
  <label>Cake Name</label>
  <input id="inCakeName" placeholder="Chocolate Cake">
  <label>Price (TZS)</label>
  <input id="inPrice" type="number" placeholder="15000">
  <label>Cake Photo - From Gallery</label>
  <input type="file" id="inPhoto" accept="image/*">
  <img id="preview" style="width:100%;border-radius:12px;display:none">
  <button class="adminBtn" onclick="addCake()">Add / Update Cake</button>
  <p style="font-size:12px;color:#888">Photos upload to Cloudinary. Visible to all customers instantly.</p>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  const CLOUD_NAME = "egyibkor";
  const UPLOAD_PRESET = "baker_upload";
  const firebaseConfig = {
    apiKey: "AIzaSyBIxPIvtxYIOaMHHmV7BxwE0lGtZ7nbsaQ",
    authDomain: "my-bakery-project-d1203.firebaseapp.com",
    databaseURL: "https://my-bakery-project-d1203-default-rtdb.firebaseio.com",
    projectId: "my-bakery-project-d1203",
    storageBucket: "my-bakery-project-d1203.firebasestorage.app",
    messagingSenderId: "450977502719",
    appId: "1:450977502719:web:be44f300a5883c0aae83ca",
    measurementId: "G-ZMSLFGCV1B"
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  let shopName = localStorage.getItem('shopName') || "Mama's Cakes";
  let whatsapp = localStorage.getItem('whatsapp') || "255712345678";
  document.getElementById('shopName').textContent = shopName;
  document.getElementById('inShopName').value = shopName;
  document.getElementById('inWhatsapp').value = whatsapp;
  const params = new URLSearchParams(window.location.search);
  if(params.get('admin') === '1'){ document.getElementById('adminPanel').style.display = 'block'; }
  document.getElementById('inPhoto').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(file){ const url = URL.createObjectURL(file); const prev = document.getElementById('preview'); prev.src = url; prev.style.display = 'block'; }
  });
  const grid = document.getElementById('menuGrid');
  onValue(ref(db, 'cakes'), (snap)=>{
    const data = snap.val();
    grid.innerHTML = '';
    if(!data){ grid.innerHTML = '<p style="padding:20px">No cakes yet. Add one in Admin.</p>'; return; }
    Object.values(data).reverse().forEach(cake=>{
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<img src="${cake.image}"><div><b>${cake.name}</b><br><span class="price">${Number(cake.price).toLocaleString()} TZS</span><a class="orderBtn" target="_blank" href="https://wa.me/${whatsapp}?text=${encodeURIComponent('Hi '+shopName+'! I want to order: '+cake.name+' - '+cake.price+' TZS')}">Order on WhatsApp</a></div>`;
      grid.appendChild(card);
    });
  });
  window.addCake = async function(){
    const name = document.getElementById('inCakeName').value.trim();
    const price = document.getElementById('inPrice').value.trim();
    const file = document.getElementById('inPhoto').files[0];
    shopName = document.getElementById('inShopName').value.trim() || shopName;
    whatsapp = document.getElementById('inWhatsapp').value.trim() || whatsapp;
    localStorage.setItem('shopName', shopName);
    localStorage.setItem('whatsapp', whatsapp);
    document.getElementById('shopName').textContent = shopName;
    if(!name || !price){ alert('Please enter cake name and price'); return; }
    if(!file){ alert('Please choose a photo'); return; }
    const btn = document.querySelector('.adminBtn');
    btn.textContent = 'Uploading... Please wait...';
    try{
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
      const data = await res.json();
      if(!data.secure_url) throw new Error(data.error?.message || 'Upload failed');
      await push(ref(db, 'cakes'), { name, price, image: data.secure_url });
      alert('Cake saved! Customers can see it now.');
      document.getElementById('inCakeName').value = '';
      document.getElementById('inPrice').value = '';
      document.getElementById('inPhoto').value = '';
      document.getElementById('preview').style.display = 'none';
    }catch(e){ alert('Error: ' + e.message); }
    btn.textContent = 'Add / Update Cake';
  };
  let lang = 'en';
  window.switchLang = function(){
    lang = lang === 'en' ? 'sw' : 'en';
    document.querySelector('[data-t="tagline"]').textContent = lang === 'en' ? 'Fresh, Sweet, Homemade' : 'Freshi, Tamu, za Nyumbani';
  };
</script>
</body>
</html>
